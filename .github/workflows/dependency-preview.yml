name: Prepare dependency updates
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Resolve security advisories
        run: npm audit fix
      - name: Recheck vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Compile Astro
        run: npm run build
      - name: Export repaired lockfile for repository update
        run: |
          echo RC_LOCK_BEGIN
          cat package-lock.json
          echo RC_LOCK_END
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-lockfile
          path: |
            package.json
            package-lock.json
