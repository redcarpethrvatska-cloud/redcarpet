name: Drive importer static checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/import-drive-portfolio.mjs'
      - 'src/data/autoIzvedeniRadovi.json'
      - 'src/data/izvedeniRadovi.js'
      - '.github/workflows/drive-portfolio-import.yml'
      - '.github/workflows/drive-import-static-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check importer syntax
        run: node --check scripts/import-drive-portfolio.mjs
      - name: Check portfolio registry shape and duplicates
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const auto = JSON.parse(fs.readFileSync('src/data/autoIzvedeniRadovi.json','utf8'));
          const legacy = JSON.parse(fs.readFileSync('src/data/portfolioMediaMap.json','utf8'));
          if (!Array.isArray(auto.projects) || !auto.media || !Array.isArray(auto.ignoredSourceFolderIds)) process.exit(1);
          const slugs = new Set(Object.keys(legacy));
          const folderIds = new Set(auto.ignoredSourceFolderIds);
          for (const project of auto.projects) {
            if (slugs.has(project.slug) || folderIds.has(project.sourceFolderId)) process.exit(1);
            slugs.add(project.slug); folderIds.add(project.sourceFolderId);
          }
          "
