name: Temporary dependency lockfile remediation
on:
  push:
    branches:
      - feat/opatija-hotel-50-soba-20261104
    paths:
      - .github/workflows/opatija-dependency-fix.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opatija-hotel-50-soba-20261104
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix compatible vulnerable transitive dependencies
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=moderate
          npm run build
      - name: Commit only updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve audited vulnerable npm dependencies"
            git push origin HEAD:feat/opatija-hotel-50-soba-20261104
          fi
